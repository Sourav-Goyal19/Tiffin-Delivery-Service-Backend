services:
  minio:
    image: minio/minio
    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: tiffin_ghar
      MINIO_ROOT_PASSWORD: tds12345

    networks:
      - mynet

    volumes:
      - minio_data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

networks:
  mynet:
    driver: bridge

volumes:
  minio_data:
    driver: local