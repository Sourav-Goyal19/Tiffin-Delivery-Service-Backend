spring.application.name=Tiffin-Delivery-Service

# --- Database (PostgreSQL / Neon) ---
# Credentials are loaded from environment variables via .env file.
# See .env.example for the full list of required variables.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Postgres Listener (for LISTEN/NOTIFY triggers) ---
postgres.listener.url=${POSTGRES_LISTENER_URL}
postgres.listener.username=${POSTGRES_LISTENER_USERNAME}
postgres.listener.password=${POSTGRES_LISTENER_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- JWT ---
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=36000

server.port=8000

# --- MinIO (S3-compatible object storage) ---
# Endpoint URL is not sensitive; credentials are externalized.
minio.url=https://tds-minio.loca.lt
minio.access.name=${MINIO_ACCESS_NAME}
minio.access.secret=${MINIO_ACCESS_SECRET}
minio.bucket.name=menu-items

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Razorpay (Payment Gateway) ---
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

distance.rate.per.km=8
distance.base.fee=20
delivery.wait.time.seconds=30

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

order.channel.name=order

# --- Firebase ---
# Firebase configuration path. Defaults to classpath resource.
# In production, set the environment variable FIREBASE_CONFIG_PATH to 'file:/path/to/key.json'
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:service-account-key.json}

graphhopper.listener.url=http://localhost:8989
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

webclient.connect-timeout=5000
webclient.response-timeout=10
